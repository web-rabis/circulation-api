syntax = "proto3";
package searcher_proxy;
option go_package = "./protobuf;protobuf";
import "protobuf/searcher_dictionary_model.proto";

message Ebook {
  int64 id = 1;
  int64 parent_id = 2;
  BibliographicLevel bibliographic_level = 3;
  TypeDescription type_description = 4;
  int64 volume_number = 5;
  bool digest = 6;
  bool krv = 7;
  Catalog catalog = 8;
  string author = 9;
  string title = 10;
  repeated Source sources = 11;
  repeated ServiceNote service_notes = 12;
  AuthorMark author_mark = 13;
  repeated Inv inv = 14;
  repeated Text texts = 15;
  repeated Sigla siglas = 16;
  EbookCard card = 17;
}
message EbookCard {
  string author = 1;
  string title = 2;
  string r_avt = 3;
  string main = 4;
  string r_cipher = 5;
  repeated string indexes = 6;
}

message AuthorMark {
  string author_mark = 1;
}
message ServiceNote {
  int64 id = 1;
  int64 ebook_id = 2;
  DictionaryServiceData service_data = 3;
}
message Inv {
  int64 id = 1;
  int64 ebook_id = 2;
  string inv_number = 3;
  string barcode = 4;
  Department department = 5;
  State state = 6;
}
message Source {
  int64 id = 1;
  int64 ebook_id = 2;
  string title = 3;
  string data = 4;
  string responsibility = 5;
  string authors = 6;
  string data_edition = 7;
  string data_out = 8;
  string special_character = 9;
  string composite_information = 10;
  string series = 11;
  string isbn = 12;
  string issn = 13;
  string parallel_name = 14;
  string year = 15;
  string pages = 16;
}
message Language {
  int64 id = 1;
  int64 ebook_id = 2;
  DictionaryLanguage language = 3;
  string source_rewrite = 4;
}
message Text  {
  int64 id = 1;
  int64 ebook_id = 2;
  string text = 3;
  string note = 4;
  string url = 5;
}
message Sigla {
  int64 id = 1;
  int64 ebook_id = 2;
  DictionarySigla sigla = 3;
}